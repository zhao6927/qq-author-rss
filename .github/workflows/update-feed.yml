name: 更新 RSS

on:
  workflow_dispatch:       # 也允许在网页上手动点按钮立即跑一次

permissions:
  contents: write          # 允许 workflow 把新 XML 推回仓库

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 抓取并生成 RSS
        # 生成逻辑在仓库根目录的 generate_feeds.py, 作者列表也在里面维护
        run: python3 generate_feeds.py

      - name: 有变化才提交推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.xml
          git diff --cached --quiet && echo "无文件变化, 不提交" || git commit -m "更新 RSS"
          git push
